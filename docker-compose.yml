version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claude_user
      POSTGRES_PASSWORD: claude_password
      POSTGRES_DB: wonderz_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: postgresql://claude_user:claude_password@postgres:5432/wonderz_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      APPROVAL_USER: admin
      APPROVAL_PASS: password
      PYTHONUNBUFFERED: 1
      RUN_MIGRATIONS: false
    depends_on:
      - postgres
    volumes:
      - .:/app
    working_dir: /app/web_ui/backend
    command: python -m uvicorn api_main:app --host 0.0.0.0 --port 8090 --reload

volumes:
  postgres_data:
