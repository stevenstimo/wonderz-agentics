version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://voetbaluser:voetbalpass@db:5432/voetbalschoenen_db
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - DEBUG=true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro  # Mount source code for development
    networks:
      - voetbal-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: voetbalschoenen_db
      POSTGRES_USER: voetbaluser
      POSTGRES_PASSWORD: voetbalpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voetbaluser -d voetbalschoenen_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voetbal-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redispass
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voetbal-network
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: celery -A app.core.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://voetbaluser:voetbalpass@db:5432/voetbalschoenen_db
      - REDIS_URL=redis://:redispass@redis:6379
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/app/app:ro
    networks:
      - voetbal-network
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: celery -A app.core.celery beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://voetbaluser:voetbalpass@db:5432/voetbalschoenen_db
      - REDIS_URL=redis://:redispass@redis:6379
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/app/app:ro
    networks:
      - voetbal-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - voetbal-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  voetbal-network:
    driver: bridge