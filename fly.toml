# fly.toml app configuration file generated for snowy-shape-3236 on 2026-02-12T17:54:25+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#


# Fly.io app configuration for wonderz-agentics
app = 'wonderz-agentics'
primary_region = 'fra'

[build]


[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/api/explainer/sections'
    protocol = 'http'
    tls_skip_verify = true


[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
