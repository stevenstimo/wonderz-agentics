# fly.toml app configuration file generated for wonderz-agentics on 2026-02-12T07:59:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wonderz-agentics'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '5s'
    interval = '10s'
    method = 'GET'
    path = '/api/tasks'
    protocol = 'http'
    timeout = '5s'
    tls_skip_verify = true

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
