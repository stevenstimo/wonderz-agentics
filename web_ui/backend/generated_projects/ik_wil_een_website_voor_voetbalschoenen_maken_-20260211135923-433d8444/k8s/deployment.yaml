apiVersion: apps/v1
kind: Deployment
metadata:
  name: voetbalschoenen-app
  namespace: voetbalschoenen
  labels:
    app: voetbalschoenen-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: voetbalschoenen-app
  template:
    metadata:
      labels:
        app: voetbalschoenen-app
    spec:
      containers:
      - name: app
        image: ghcr.io/your-username/voetbalschoenen:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port